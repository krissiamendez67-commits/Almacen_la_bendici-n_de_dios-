<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Almacénes La Bendición De Dios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-cart4"></i> Almacén El Ahorro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="ofertas.html">Ofertas</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item ms-lg-3">
                    <button class="btn btn-light position-relative" onclick="abrirCarrito()">
                        <i class="bi bi-cart3"></i> Carrito
                        <span id="cantidad-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="text-center mb-5">
            <span class="text-primary fw-bold">CATÁLOGO</span>
            <h1 class="fw-bold">Nuestros productos</h1>
            <p class="text-muted">Busca, filtra y agrega productos al carrito.</p>
        </div>

        <!-- Buscador -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar producto..." onkeyup="buscarProducto()">
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
            <button class="btn btn-primary" onclick="filtrarCategoria('todos')">Todos</button>
            <button class="btn btn-outline-primary" onclick="filtrarCategoria('abarrotes')">Abarrotes</button>
            <button class="btn btn-outline-primary" onclick="filtrarCategoria('bebidas')">Bebidas</button>
            <button class="btn btn-outline-primary" onclick="filtrarCategoria('limpieza')">Limpieza</button>
            <button class="btn btn-outline-primary" onclick="filtrarCategoria('hogar')">Hogar</button>
        </div>

        <div id="lista-productos" class="row g-4"></div>
    </div>
</section>

<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        <p class="mb-1"><i class="bi bi-cart4"></i> <strong>Almacénes La Bendición De Dios </strong></p>
        <small class="text-secondary">© 2026 Todos los derechos reservados.</small>
    </div>
</footer>

<!-- Carrito lateral -->
<div id="fondo-carrito" class="fondo-carrito" onclick="cerrarCarrito()"></div>
<aside id="carrito" class="carrito shadow-lg">
    <div class="carrito-header bg-primary text-white p-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-cart3"></i> Mi carrito</h5>
        <button onclick="cerrarCarrito()" class="btn btn-sm btn-light"><i class="bi bi-x-lg"></i></button>
    </div>
    <div id="productos-carrito" class="productos-carrito p-3"></div>
    <div class="p-3 border-top">
        <div class="d-flex justify-content-between mb-3">
            <strong>Total:</strong>
            <strong class="text-primary fs-4">$<span id="total-carrito">0.00</span></strong>
        </div>
        <button class="btn btn-success w-100 mb-2" onclick="realizarPedido()"><i class="bi bi-whatsapp"></i> Realizar pedido</button>
        <button class="btn btn-outline-danger w-100" onclick="vaciarCarrito()"><i class="bi bi-trash"></i> Vaciar carrito</button>
    </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
